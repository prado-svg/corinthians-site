<!-- MENU DE NAVEGACAO -->

  <a href="index.html" class="menu-logo">

         alt="Escudo do Corinthians">

    <span class="menu-nome">
                <small>SPORT CLUB</small>
                <span>CORINTHIANS PAULISTA</span>
            </span>
  </a>

  <div class="menu-links">
    <a href="index.html">Início</a>

<!-- SALA DE TROFEUS -->

<main class="sala-trofeus">

  <div class="sala-ambiente">

    <header class="sala-titulo">
      <h1>Sala de Troféus</h1>
      <p>As glórias eternas do Timão</p>
    </header>

    <div class="sala-palco">
      <button class="seta seta-esquerda" id="anterior"
              type="button" aria-label="Troféu anterior">
        &#10094;
      </button>

      <button class="seta seta-direita" id="proximo"
              type="button" aria-label="Próximo troféu">
        &#10095;
      </button>

      <div class="trofeu-vitrine">
        <img src="img/trofeus/mundial.png"
             alt="Troféu do Mundial de Clubes"
             class="trofeu-imagem"
             id="imagem-trofeu">
      </div>

      <div class="trofeu-pedestal"></div>
      <div class="trofeu-info">
        <h2 id="trofeu-nome">Mundial de Clubes</h2>
        <p id="trofeu-quantidade">2 títulos</p>
        <p id="trofeu-anos">2000 • 2012</p>
      </div>

    </div>

  </div>

</main>
<script src="js/trofeus.js"></script>
